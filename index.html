                            <h2>AULA 2 - ARQUITETURA DA COMPUTAÇÃO EM NUVEM</h2>
                            <p>Olá! Depois de entendermos o que é a nuvem, agora vamos abrir a "caixa-preta" e ver como ela é montada por dentro. É como conhecer a planta de uma casa: você já sabia morar nela; agora vai entender as paredes, os canos e a fiação.</p>

                            <h3>O que você vai aprender aqui:</h3>
                            <ul>
                                <li>A arquitetura de infraestrutura em nuvem (on premise × nuvem, camadas, front × back end, datacenters).</li>
                                <li>A administração da camada de servidores e os serviços em nuvem.</li>
                                <li>As arquiteturas de solução (elasticidade, balanceamento, edge computing, serverless) e as estratégias de migração.</li>
                            </ul>

                            <div class="section-divider"><span>PARTE 1 — ARQUITETURA DE INFRAESTRUTURA</span></div>

                            <h3>1.1 On premise × nuvem</h3>
                            <ul>
                                <li><strong>Infraestrutura on premise:</strong> tecnologia comprada/alugada e hospedada dentro da própria empresa (servidores, redes, software). A empresa mantém e opera tudo.</li>
                                <li><strong>Infraestrutura em nuvem:</strong> serviços de computação virtual, armazenamento, rede, bancos de dados e serviços especializados (IA, ML, análise).</li>
                            </ul>
                            <div class="highlight-box">
                                <p><strong>Em uma frase:</strong> on premise = você é dono e cuida de tudo; nuvem = você consome um serviço e quem cuida é o provedor.</p>
                            </div>

                            <h3>1.2 As três camadas da infraestrutura</h3>
                            <ol>
                                <li><strong>Camada de servidor:</strong> servidores virtuais, físicos ou híbridos.</li>
                                <li><strong>Camada de armazenamento:</strong> sistemas de arquivos, banco de dados e outros tipos.</li>
                                <li><strong>Camada de rede:</strong> conectividade, segurança e gerenciamento de aplicativos.</li>
                            </ol>
                            <div class="tip-box">
                                <p><strong>Para fixar:</strong> as três camadas são servidor (onde roda), armazenamento (onde guarda) e rede (como conecta). Toda arquitetura gira em torno delas.</p>
                            </div>

                            <h3>1.3 Arquitetura × implementação</h3>
                            <ul>
                                <li><strong>Arquitetura:</strong> descreve características e funções — o "projeto" (arquiteto desenha o prédio).</li>
                                <li><strong>Implementação:</strong> a construção de fato — o "construir" (engenheiro executa).</li>
                            </ul>
                            <p>A estrutura básica contém: usuários dispersos geograficamente; provedores de serviços; e canais de comunicação entre eles (a internet).</p>

                            <h3>1.4 Front end × Back end</h3>
                            <ul>
                                <li><strong>Front end:</strong> a interface que o usuário usa (smartphone, tablet, navegador). Hoje, em geral, o usuário interage apenas com o navegador.</li>
                                <li><strong>Back end:</strong> a própria nuvem — servidores, armazenamento e softwares de gerenciamento. Fica geograficamente distante dos usuários.</li>
                            </ul>
                            <div class="tip-box">
                                <p><strong>Analogia:</strong> o front end é a frente da loja (balcão de pedidos); o back end é o depósito e a cozinha. A internet conecta os dois.</p>
                            </div>
                            <p>Principais componentes do back end: aplicação (recebe requisições), serviços (o coração da nuvem), cloud runtime (onde o serviço é executado, com hypervisores), armazenamento, infraestrutura (hardware), gerenciamento e segurança.</p>

                            <h3>1.5 Os datacenters</h3>
                            <p><strong>Organização física:</strong> construções projetadas para abrigar servidores e dispositivos interconectados por redes de alto desempenho. São mantidos por organizações especializadas.</p>
                            <p><strong>Organização lógica:</strong> serviços de gerenciamento alocam recursos corretamente (evitando gargalos); serviços de segurança controlam acesso, protegem contra invasões e garantem operação contínua mesmo sob ataque ou falha.</p>

                            <div class="section-divider"><span>PARTE 2 — CAMADA DE SERVIDORES E SERVIÇOS</span></div>

                            <h3>2.1 A camada de servidores</h3>
                            <p>Servidores (físicos ou virtuais) hospedam serviços, aplicativos e dados, além de armazenar e gerenciar arquivos, backups e imagens.</p>
                            <p>Administrar envolve: monitorar desempenho, gerenciar configurações, aplicar patches de segurança, fazer backups regulares e gerenciar usuários.</p>
                            <p>Ferramentas essenciais: servidores de gerenciamento, gerenciadores de configuração, monitoramento, automação de tarefas e segurança.</p>

                            <h3>2.2 Plataformas de administração por provedor</h3>
                            <ul>
                                <li>AWS: Amazon EC2 (criar/gerenciar VMs) + Amazon CloudWatch (monitorar).</li>
                                <li>Microsoft Azure: Azure Virtual Machines + Azure Monitor.</li>
                                <li>Google Cloud: Compute Engine + Cloud Monitoring.</li>
                                <li>IBM Cloud: IBM Virtual Servers + IBM Cloud Monitoring.</li>
                            </ul>
                            <div class="tip-box">
                                <p><strong>Padrão:</strong> todo provedor tem um serviço para criar VMs e outro para monitorá-las. É sempre esse par.</p>
                            </div>

                            <h3>2.3 Os serviços em nuvem</h3>
                            <p>Recursos de software e hardware fornecidos como serviço pela internet — o usuário usa sem se preocupar com infraestrutura. Exemplos:</p>
                            <ul>
                                <li>Armazenamento na nuvem (acessar arquivos de qualquer lugar);</li>
                                <li>Computação na nuvem (VMs a clusters);</li>
                                <li>Infraestrutura (VPNs, firewalls);</li>
                                <li>Plataforma (criar/implantar/gerenciar apps);</li>
                                <li>Análise de dados (big data) e desenvolvimento via API.</li>
                            </ul>

                            <h3>2.4 Componentes do back end em detalhe</h3>
                            <ul>
                                <li><strong>Aplicação:</strong> recebe requisições e coordena as necessidades do usuário com os recursos.</li>
                                <li><strong>Serviço:</strong> coração da nuvem — é onde qualquer tarefa é executada.</li>
                                <li><strong>Cloud runtime:</strong> onde o serviço é executado (com o hypervisor); funciona como um SO da nuvem, permitindo várias VMs paralelas num mesmo servidor.</li>
                                <li><strong>Armazenamento:</strong> HDs (grande capacidade, 8–16 TB), SSDs (muito mais rápidos, mas mais caros) e tecnologias mais recentes (como Optane). Há também NAS (storage de rede) e protocolos de compartilhamento CIFS e NFS.</li>
                                <li><strong>Infraestrutura de processamento:</strong> servidores com processadores Xeon/Opteron, muita RAM de baixa latência, GPUs (para alto desempenho) e TPUs do Google (ASICs focados em IA).</li>
                            </ul>

                            <div class="section-divider"><span>PARTE 3 — ARQUITETURAS DE SOLUÇÃO</span></div>

                            <h3>3.1 IaaS na prática</h3>
                            <p>O IaaS fornece computação e infraestrutura para criar aplicativos e serviços. Inclui hardware (VMs, armazenamento, balanceamento de carga) e software de orquestração. Principais cenários:</p>

                            <h4>Cenário de elasticidade</h4>
                            <p>Provisionar rapidamente recursos adicionais em resposta à demanda. Você pode adicionar servidores/memória/armazenamento para picos, licenciar recursos extras e retirá-los quando não precisar mais — pagando só pelo que usar. Funciona com escalonamento vertical e horizontal.</p>

                            <h4>Cenário de balanceamento de carga</h4>
                            <p>Sistema que distribui o tráfego entre vários servidores para garantir alta disponibilidade, aumentar velocidade de resposta e evitar congestionamento. Ex.: Elastic Load Balancer da Amazon.</p>
                            <div class="tip-box">
                                <p><strong>Analogia:</strong> o balanceador é como um porteiro de banco que distribui os clientes entre os caixas livres — ninguém fica sobrecarregado, e todos são atendidos mais rápido.</p>
                            </div>

                            <h4>Cenário de alta disponibilidade</h4>
                            <p>Foco em garantir o máximo tempo de funcionamento, com: replicação de dados, balanceamento de carga, redundância (cópias de backup), monitoramento contínuo e atualizações frequentes.</p>

                            <h4>Cenários multicloud e híbrido</h4>
                            <ul>
                                <li><strong>Multicloud:</strong> usar vários provedores num ambiente único (com orquestração via Kubernetes/OpenStack).</li>
                                <li><strong>Híbrido:</strong> combinar servidores físicos locais com serviços de nuvem para a demanda crescente.</li>
                            </ul>

                            <h3>3.2 Edge computing (computação de borda)</h3>
                            <p>Abordagem em que dados são processados e armazenados <strong>localmente</strong> (na "borda" da rede), perto do usuário/dispositivo, em vez de ir para um datacenter remoto. Diminui latência e aumenta confiabilidade.</p>
                            <p><strong>IoT × Edge:</strong> na IoT os dispositivos enviam todos os dados para a nuvem; no edge, dados são processados localmente e apenas uma parte é enviada ao datacenter.</p>
                            <p>Ideal para: IoT, decisões em tempo real (reconhecimento facial, localização), realidade aumentada, jogos, problemas de largura de banda.</p>
                            <div class="tip-box">
                                <p><strong>Para fixar:</strong> edge = processar perto do usuário (borda), não no datacenter.</p>
                            </div>

                            <h3>3.3 Edge + Serverless</h3>
                            <p>Em redes distribuídas como o edge, seria impossível gerenciar infraestrutura manualmente. O serverless resolve isso: serviços gerenciados cuidam de escalonamento, disponibilidade e monitoramento — o desenvolvedor só escreve código.</p>

                            <h3>3.4 Migração para a nuvem — os 7 Rs</h3>
                            <ol>
                                <li><strong>Rehost ("lift and shift"):</strong> mover aplicações para a nuvem mantendo as configurações (sem alterar arquitetura). Migra servidores físicos/virtuais para IaaS.</li>
                                <li><strong>Replatform:</strong> para sistemas legados; emula as aplicações em VMs, com alguns ajustes de configuração sem mudar a arquitetura principal.</li>
                                <li><strong>Repurchase ("drop and shop"):</strong> substituir o app on premise por um SaaS nativo da nuvem (trocar de plataforma).</li>
                                <li><strong>Refactoring / Re-architecting:</strong> desenvolver do zero (nativo da nuvem), usando microsserviços, serverless, contêineres. Melhor ROI no longo prazo.</li>
                                <li><strong>Retire:</strong> desativar serviços que não são mais necessários.</li>
                                <li><strong>Retain ("revisit"):</strong> manter algumas aplicações no local (latência, conformidade, atualizações recentes).</li>
                                <li><strong>Relocate:</strong> mover infraestrutura mantendo os mesmos componentes e processos (sem envolver desenvolvedores, só equipe de operações).</li>
                            </ol>

                            <h2>AULA 3 - SEGURANÇA EM COMPUTAÇÃO NA NUVEM</h2>
                            <p>Olá! Depois de entendermos o que é a nuvem e como ela é montada (arquitetura), chegou a hora da pergunta que todo mundo faz: "mas será que é seguro?". Afinal, quando colocamos nossos dados "na nuvem", eles vão parar em servidores que nem sabemos onde ficam.</p>
                            <p>A resposta curta é: sim, pode ser muito seguro — mas só se cada um fizer a sua parte.</p>

                            <h3>O que você vai aprender aqui:</h3>
                            <ul>
                                <li>Fundamentos da nuvem (recapitulando NIST) e os princípios da segurança da informação (tríade CID).</li>
                                <li>Aspectos de segurança e o modelo de responsabilidade compartilhada.</li>
                                <li>A segurança de cada serviço (VMs, contêineres, bancos, armazenamento, rede, monitoramento).</li>
                                <li>Orientações da CSA (Cloud Security Alliance).</li>
                            </ul>

                            <div class="section-divider"><span>PARTE 1 — FUNDAMENTOS (NIST)</span></div>

                            <h3>1.1 A mudança de paradigma</h3>
                            <p>Durante décadas, montar um sistema era comprar hardware → instalar SO → implantar software, e depois manter tudo com patches, backups e monitoramento contínuos.</p>
                            <p>A nuvem mudou isso: você consome serviços gerenciados (de um software simples a ERPs/CRMs), e os serviços automatizam tarefas antes manuais, deixando a empresa livre para focar em inovação.</p>

                            <h3>1.2 As 5 características essenciais (NIST 800-145)</h3>
                            <ol>
                                <li><strong>On-demand self-service:</strong> você provisiona recursos sozinho (em minutos), sem falar com ninguém.</li>
                                <li><strong>Broad network access:</strong> acesso para milhões de usuários de qualquer dispositivo.</li>
                                <li><strong>Resource pooling:</strong> milhares de computadores trabalhando de forma coordenada e compartilhada.</li>
                                <li><strong>Rapid elasticity:</strong> escalar de 1 para milhares de servidores — e voltar — rapidamente.</li>
                                <li><strong>Measured service:</strong> pague só pelo que consumir, com relatório de uso.</li>
                            </ol>
                            <div class="warning-box">
                                <p><strong>Pegadinha de prova:</strong> não confunda as 5 características essenciais com os modelos de serviço (IaaS/PaaS/SaaS) nem com os modelos de implantação (pública/privada/híbrida/comunitária) — são categorias diferentes!</p>
                            </div>

                            <h3>1.3 Os 3 modelos de serviço</h3>
                            <ul>
                                <li><strong>SaaS:</strong> você usa o aplicativo pronto pelo navegador (ex.: Gmail). Toda infraestrutura fica transparente.</li>
                                <li><strong>PaaS:</strong> você implanta seus próprios apps usando ferramentas suportadas pelo provedor. Não gerencia a infraestrutura — só o código.</li>
                                <li><strong>IaaS:</strong> o provedor oferece processamento, armazenamento e rede crus. Você instala SOs e softwares; controla SO, armazenamento e apps — mas não a infraestrutura física.</li>
                            </ul>

                            <h3>1.4 Os 4 modelos de implantação</h3>
                            <ul>
                                <li><strong>Nuvem privada:</strong> para uso exclusivo de uma organização.</li>
                                <li><strong>Nuvem comunitária:</strong> para comunidades específicas que compartilham preocupações (segurança, conformidade).</li>
                                <li><strong>Nuvem pública:</strong> aberta ao público em geral.</li>
                                <li><strong>Nuvem híbrida:</strong> junção de duas ou mais nuvens ligadas por tecnologia que permite portabilidade.</li>
                            </ul>

                            <h3>1.5 Os 3 gigantes do mercado</h3>
                            <ul>
                                <li>Netflix → AWS (streaming).</li>
                                <li>Mercedes-Benz → Azure (pesquisa e desenvolvimento).</li>
                                <li>Home Depot → GCP (lojas on-line).</li>
                            </ul>
                            <p>Exemplos por modelo:</p>
                            <ul>
                                <li>IaaS: Amazon EC2 / Azure VM / Google Compute Engine.</li>
                                <li>PaaS: Elastic Beanstalk / Azure Web Apps / Google App Engine.</li>
                                <li>SaaS: Microsoft 365 / Google Workspace / Salesforce CRM.</li>
                            </ul>

                            <div class="section-divider"><span>PARTE 2 — ASPECTOS DE SEGURANÇA</span></div>

                            <h3>2.1 A tríade CID</h3>
                            <p>Os três princípios fundamentais da segurança da informação que a nuvem deve manter:</p>
                            <ul>
                                <li><strong>Confidencialidade:</strong> só quem tem direito acessa a informação.</li>
                                <li><strong>Integridade:</strong> a informação não é alterada indevidamente durante transmissão/armazenamento.</li>
                                <li><strong>Disponibilidade:</strong> a informação está disponível sempre que necessária.</li>
                            </ul>
                            <div class="tip-box">
                                <p><strong>Decore:</strong> Confidencialidade + Integridade + Disponibilidade = CID.</p>
                            </div>

                            <h3>2.2 O que mudou da on premise para a nuvem?</h3>
                            <p>Na on premise a empresa cuidava de tudo; na nuvem, responsabilidades são divididas. Os grandes provedores investem MUITO mais em segurança do que a maioria das empresas conseguiria sozinhas — uma violação destruiria a confiança e o negócio deles.</p>

                            <h3>2.3 O modelo de responsabilidade compartilhada</h3>
                            <div class="highlight-box">
                                <p><strong>Regra de ouro:</strong> a responsabilidade do cliente <em>aumenta</em> conforme passamos de SaaS → PaaS → IaaS.</p>
                                <p><strong>SaaS &lt; PaaS &lt; IaaS</strong> (em responsabilidade do cliente).</p>
                            </div>
                            <ul>
                                <li><strong>SaaS:</strong> provedor cuida de quase tudo; ao cliente resta proteger as credenciais contra phishing/engenharia social. Ex.: Dropbox, Zoom, Microsoft 365.</li>
                                <li><strong>PaaS:</strong> provedor cuida de apps/SOs da plataforma; cliente cuida do código e dos dados. Ex.: Azure App Service, Elastic Beanstalk, GKE.</li>
                                <li><strong>IaaS:</strong> provedor cuida de virtualização, discos, rede e segurança física; cliente cuida do SO e toda a pilha de software + dados. Ex.: EC2, Azure VM, Compute Engine.</li>
                            </ul>
                            <div class="tip-box">
                                <p><strong>Analogia da casa alugada:</strong> IaaS = alugar o terreno (você constrói e cuida de tudo). PaaS = alugar o prédio pronto (você só cuida da decoração = código). SaaS = se hospedar num hotel (o hotel cuida de tudo; você só não perde a chave = senha).</p>
                            </div>

                            <div class="section-divider"><span>PARTE 3 — SERVIÇOS EM NUVEM E SUA SEGURANÇA</span></div>

                            <h3>3.1 Máquinas virtuais (VMs)</h3>
                            <p>A VM é o recurso mais básico do IaaS. Passos: escolher tipo de máquina (CPU × memória), imagem do SO (Windows/Linux), configurar armazenamento/rede/permissões, implantar apps e <strong>fazer manutenção contínua do SO (aplicar patches)</strong> — essa parte é responsabilidade do cliente no IaaS!</p>

                            <h3>3.2 Contêineres</h3>
                            <p>Evolução da VM — mais leve e enxuto. Contém tudo que a aplicação precisa (arquivos, variáveis de ambiente, bibliotecas), compartilhando o kernel do host. Vantagens: portabilidade, espaço reduzido e velocidade. <strong>Docker</strong> empacota; <strong>Kubernetes</strong> orquestra centenas de contêineres em produção.</p>

                            <h3>3.3 Serverless (FaaS)</h3>
                            <p>O cliente importa código, seleciona interpretador, escolhe CPU/memória e define o gatilho. É orientado a eventos, cobrado por execução, escalável automaticamente, sem configuração de servidor.</p>

                            <h3>3.4 Banco de dados gerenciado</h3>
                            <p>Em vez de instalar MySQL/PostgreSQL numa VM (e ter que cuidar de tudo — IaaS), o provedor supervisiona a segurança do SO e do banco: <em>hardening</em>, backup, patches, monitoramento, auditoria, criptografia. O cliente só escolhe o tipo, implanta a instância, configura rede/logs/backup e conecta a aplicação.</p>

                            <h3>3.5 Serviços de armazenamento</h3>
                            <p>Três categorias:</p>
                            <ul>
                                <li><strong>File storage (arquivo):</strong> tipo NAS; protocolos NFS/SMB; montável em várias VMs.</li>
                                <li><strong>Object storage (objeto):</strong> objetos em <em>buckets</em>, acessados via API HTTPS (ideal para arquivos estáticos/backups).</li>
                                <li><strong>Block storage (bloco):</strong> tipo SAN; volumes formatáveis (NTFS/Ext4) para bancos/SOs.</li>
                            </ul>
                            <p>As 4 ameaças ao armazenamento: acesso não autorizado, vazamento, exfiltração (roubo), perda de dados.</p>
                            <p>As 5 contramedidas:</p>
                            <ol>
                                <li><strong>ACL</strong> (lista de controle de acesso);</li>
                                <li><strong>IAM</strong> (gerenciamento de identidade e acesso — quem pode acessar o quê);</li>
                                <li><strong>Criptografia</strong> (dados em trânsito e armazenados);</li>
                                <li><strong>Auditoria</strong> (logs de quem fez o quê e quando);</li>
                                <li><strong>Backups</strong> (resgate de dados apagados/alterados).</li>
                            </ol>
                            <div class="tip-box">
                                <p><strong>Combo de proteção:</strong> ACL + IAM + criptografia + auditoria + backup.</p>
                            </div>

                            <h3>3.6 Serviços de rede</h3>
                            <ul>
                                <li><strong>DNS:</strong> traduz nomes de host em IPs.</li>
                                <li><strong>CDN:</strong> conteúdo em cache em vários locais do mundo — mais rápido; também defende contra DDoS.</li>
                                <li><strong>VPN:</strong> acesso seguro via túnel criptografado (geralmente com MFA — autenticação multifator).</li>
                                <li><strong>WAF:</strong> firewall de aplicação web que detecta/mitiga ataques HTTP/HTTPS.</li>
                                <li><strong>Proteção DDoS:</strong> AWS Shield, Azure DDoS Protection, Google Cloud Armor.</li>
                            </ul>

                            <h3>3.7 Monitoramento e auditoria</h3>
                            <ul>
                                <li><strong>Trilha de auditoria:</strong> registro documentado de todas as ações (quem fez o quê, quando).</li>
                                <li><strong>Alertas:</strong> regras pré-configuradas (ex.: alertar quando admin faz login).</li>
                                <li><strong>SIEM:</strong> correlaciona logs de vários serviços; dispara alertas inteligentes quando eventos separados em serviços diferentes juntos indicam risco — reduz falsos positivos.</li>
                            </ul>

                            <div class="section-divider"><span>PARTE 4 — ORIENTAÇÕES DA CSA</span></div>

                            <h3>4.1 Quem é a CSA?</h3>
                            <p>A <strong>Cloud Security Alliance</strong> é a organização líder global em boas práticas de segurança em nuvem (cloudsecurityalliance.org).</p>
                            <p>Seus 14 domínios se agrupam em 3: <strong>conceitual</strong>, <strong>governança</strong> e <strong>operação</strong>.</p>

                            <h3>4.2 Domínio conceitual</h3>
                            <p>Computação em nuvem = novo modelo operacional + tecnologias para gerenciar pools de recursos compartilhados. As duas técnicas-chave são: <strong>abstração</strong> (criar o pool de recursos) e <strong>orquestração</strong> (coordenar a entrega aos clientes).</p>
                            <p><strong>Multilocação</strong> = segregação (dividir recursos entre grupos) + isolamento (garantir que um grupo não veja/modifique os ativos de outro).</p>
                            <p>As 4 camadas da arquitetura funcional da CSA:</p>
                            <ol>
                                <li><strong>Infraestrutura</strong> (computação, rede, armazenamento);</li>
                                <li><strong>Metaestrutura</strong> (protocolos que ligam infraestrutura às camadas superiores — a grande diferença da nuvem!);</li>
                                <li><strong>Appliestrutura</strong> (aplicativos + serviços PaaS);</li>
                                <li><strong>Infoestrutura</strong> (dados e informações).</li>
                            </div>
                            <div class="tip-box">
                                <p><strong>Analogia:</strong> infraestrutura = o corpo; metaestrutura = o sistema nervoso (liga tudo); appliestrutura = as ações; infoestrutura = as memórias.</p>
                            </div>
                            <p>Modelos de segurança recomendados: CSA Enterprise Architecture, CSA Cloud Controls Matrix, NIST SP 500-299, ISO/IEC 27017.</p>

                            <h3>4.3 Domínios de governança (estratégia)</h3>
                            <p>Governança e gestão de risco, aspectos legais/contratuais, compliance/auditorias e governança da informação.</p>

                            <h3>4.4 Domínios de operação (táticas/implementação)</h3>
                            <p>Continuidade do negócio, segurança da infraestrutura, virtualização/contêineres, resposta a incidentes, segurança das aplicações, criptografia e dados, IAM (identidade/acessos) e tecnologias relacionadas (Big Data, IoT, mobile).</p>

        // ==================== ROTEAMENTO E RENDERIZAÇÃO ====================

        let estadoAtual = 'materias'; // 'materias', 'aulas', 'conteudo'
        let materiaAtual = null;
        let aulaAtual = null;

        function render() {
            const app = document.getElementById('app');

            if (estadoAtual === 'materias') {
                app.innerHTML = `
                    <h2 class="page-title">📖 Escolha uma Matéria</h2>
                    <div class="grid">
                        ${materias.map(m => `
                            <div class="card materia" onclick="abrirMateria('${m.id}')">

                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (estadoAtual === 'aulas') {
                const m = materias.find(mat => mat.id === materiaAtual);
                app.innerHTML = `
                    <div class="breadcrumb">
                        <button onclick="voltarMaterias()">← Matérias</button>
                        <span>›</span>
                        <span style="color:#e94560;font-weight:bold;">${m.nome}</span>
                    </div>

                    <div class="grid">
                        ${m.aulas.map(a => `
                            <div class="card aula" onclick="abrirAula('${a.id}')">
                                <div class="card-icon">${a.icone}</div>
                                <h3>Aula ${a.numero}</h3>
                                <p>${a.titulo}</p>
                                <p style="margin-top:10px;font-size:0.9em;color:#3498db;">${a.questoes.length} questões</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (estadoAtual === 'conteudo') {
                const m = materias.find(mat => mat.id === materiaAtual);
                const a = m.aulas.find(au => au.id === aulaAtual);
                app.innerHTML = `
                    <div class="breadcrumb">
                        <button onclick="voltarMaterias()">← Matérias</button>
                        <span>›</span>
                        <button onclick="voltarAulas()">${m.nome}</button>

                        <span style="color:#e94560;font-weight:bold;">Aula ${a.numero}</span>

                        ${a.questoes.map((q, qi) => renderQuestao(q, qi)).join('')}

        function renderQuestao(q, qi) {
            const letras = ['A', 'B', 'C', 'D', 'E'];
            return `
                <div class="questao" id="questao-${qi}">
                    <h4>${q.pergunta.replace(/\n/g, '<br>')}</h4>
                    <div class="opcoes">
                        ${q.opcoes.map((op, oi) => `
                            <div class="opcao" id="opcao-${qi}-${oi}" onclick="responder(${qi}, ${oi})">
                                <span class="opcao-letra">${letras[oi]}</span>
                                <span>${op}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback-${qi}">
                        <h5 id="feedback-titulo-${qi}"></h5>
                        <p id="feedback-texto-${qi}"></p>
                    </div>
                </div>
            `;
        }

        function responder(qi, oi) {
            const m = materias.find(mat => mat.id === materiaAtual);
            const a = m.aulas.find(au => au.id === aulaAtual);
            const q = a.questoes[qi];

            const questaoEl = document.getElementById(`questao-${qi}`);
            const feedbackEl = document.getElementById(`feedback-${qi}`);

            // Se já acertou, não faz nada
            if (questaoEl.classList.contains('correta')) return;

            // Desabilita novas respostas? Vamos permitir tentar de novo em erradas, mas marcar visualmente
            // Marca a opção selecionada
            for (let i = 0; i < q.opcoes.length; i++) {
                const opEl = document.getElementById(`opcao-${qi}-${i}`);
                if (i === q.correta) {
                    opEl.classList.add('correta-resposta');
                }
                opEl.classList.add('desabilitado');
            }

            const opcaoSelecionada = document.getElementById(`opcao-${qi}-${oi}`);
            const titulo = document.getElementById(`feedback-titulo-${qi}`);
            const texto = document.getElementById(`feedback-texto-${qi}`);

            if (oi === q.correta) {
                // Acertou
                questaoEl.classList.remove('incorreta');
                questaoEl.classList.add('correta');
                feedbackEl.classList.remove('incorreto');
                feedbackEl.classList.add('correto');
                opcaoSelecionada.classList.add('correta-resposta');
                titulo.innerHTML = '<span class="parabens">🎉</span> Parabéns! Você acertou!';
                texto.innerHTML = `<strong>Resposta correta!</strong><br><br>${q.explicacao}`;
            } else {
                // Errou
                questaoEl.classList.remove('correta');
                questaoEl.classList.add('incorreta');
                feedbackEl.classList.remove('correto');
                feedbackEl.classList.add('incorreto');
                opcaoSelecionada.classList.add('selecionada');
                titulo.innerHTML = '❌ Que pena, você errou! Tente novamente.';
                texto.innerHTML = 'Veja a resposta correta destacada em verde acima. Clique em outra opção se quiser tentar de novo — ou leia a explicação assim que acertar!';

                // Permite tentar de novo após um tempo: remove o "desabilitado" das incorretas
                setTimeout(() => {
                    for (let i = 0; i < q.opcoes.length; i++) {
                        const opEl = document.getElementById(`opcao-${qi}-${i}`);
                        if (i !== q.correta) {
                            opEl.classList.remove('selecionada', 'desabilitado');
                        }
                    }
                    questaoEl.classList.remove('incorreta');
                    feedbackEl.classList.remove('incorreto');
                }, 1800);
            }
        }

        function abrirMateria(id) {
            materiaAtual = id;
            estadoAtual = 'aulas';
            window.scrollTo(0, 0);
            render();
        }

        function abrirAula(id) {
            aulaAtual = id;
            estadoAtual = 'conteudo';
            window.scrollTo(0, 0);
            render();
        }

        function voltarMaterias() {
            materiaAtual = null;
            aulaAtual = null;
            estadoAtual = 'materias';
            window.scrollTo(0, 0);
            render();
        }

        function voltarAulas() {
            aulaAtual = null;
            estadoAtual = 'aulas';
            window.scrollTo(0, 0);
            render();
        }

        // Inicializa
        render();
    </script>
